<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Book Library</title>
    <link rel="stylesheet" href="style.css"> <!-- Link to your CSS file -->
</head>
<body>
    <header>
        <h1>My Book Library</h1>
        <nav>
            <a href="#home">Home</a>
            <a href="#add-book">Add Book</a>
            <a href="#my-library">My Library</a>
            <a href="#about">About</a>
        </nav>
    </header>

    <main>
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="Search by title or author...">
            <button id="search-button">Search</button>
        </div>

        <div class="add-book">
            <h2>Add a New Book</h2>
            <input type="text" id="title" placeholder="Book Title" required>
            <input type="text" id="author" placeholder="Author" required>
            <input type="text" id="cover" placeholder="Cover Image URL" required>
            <button id="add-button">Add Book</button>
        </div>

        <div class="book-catalog" id="book-catalog">
            <!-- Books will be dynamically added here -->
        </div>
    </main>

    <footer>
        <p>&copy; 2024 My Book Library. All rights reserved.</p>
    </footer>

    <script src="script.js"></script> <!-- Link to your JavaScript file -->
</body>
</html>
